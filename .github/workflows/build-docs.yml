name: Build Docs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # The same script Cloudflare Pages runs, so CI validates the deployment
      # path rather than an approximation of it. There is no environment setup
      # step: build.sh provisions .venv-docs from requirements.txt itself, and
      # doing it here as well would only prove that a second, differently built
      # environment also works.
      - name: Build the docs
        run: bash build.sh

      - name: Upload static docs site
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: pgedge-docs-site
          path: site
