name: Update RAG Index

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rag-update
  cancel-in-progress: true

jobs:
  update-rag-index:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger RAG index update via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.RAG_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["flock -n /var/lock/pgedge-load-docs.lock sudo /usr/local/bin/load-docs"]' \
            --timeout-seconds 1800 \
            --comment "RAG index update triggered by docs merge" \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to complete
        run: |
          echo "Waiting for command ${{ steps.ssm.outputs.command_id }} to complete..."
          for i in $(seq 1 60); do
            set +e
            SSM_OUTPUT=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ secrets.RAG_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>&1)
            SSM_EXIT=$?
            set -e

            if [ $SSM_EXIT -ne 0 ]; then
              if echo "$SSM_OUTPUT" | grep -q "InvocationDoesNotExist"; then
                STATUS="InProgress"
              else
                echo "AWS CLI error: $SSM_OUTPUT"
                exit 1
              fi
            else
              STATUS="$SSM_OUTPUT"
            fi

            echo "  Attempt $i: status=$STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "RAG index update completed successfully."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "RAG index update failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "${{ steps.ssm.outputs.command_id }}" \
                --instance-id "${{ secrets.RAG_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 30
          done

          echo "Timed out waiting for SSM command to complete."
          exit 1
