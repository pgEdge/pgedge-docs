{% extends "base.html" %}

{% block content %}
<div id="not-found-content" style="display: none;">
  <h1>Page not found</h1>
  <p>The page you requested could not be found.</p>
</div>

<script>
(function() {
    var notFoundContent = document.getElementById('not-found-content');

    function show404() {
        notFoundContent.style.display = 'block';
    }

    function tryRedirect(url) {
        fetch(url, { method: 'HEAD' })
            .then(function(response) {
                if (response.ok) {
                    window.location.replace(url);
                } else {
                    show404();
                }
            })
            .catch(function() {
                show404();
            });
    }

    // Which version an unversioned URL falls back to. The same mapping the
    // docset roots redirect to, from scripts/expand_imports.py, so the two
    // cannot disagree about which version is current.
    var versionedDocsets = {
        {# `| items` rather than `.items()`: both Jinja2 and MiniJinja accept the
           filter, only Jinja2 accepts the method. #}
        {% for docset, version in (config.extra.docset_latest or {}) | items %}
        '{{ docset }}': '{{ version }}'{% if not loop.last %},{% endif %}
        {% endfor %}
    };

    // Legacy prefix mappings (old prefix -> current docset slug)
    var legacyPrefixes = {
        'spock_ext': 'spock-v5',
        'pgedge-mcp': 'pgedge-postgres-mcp-server',
        'pgedge-postgres-mcp': 'pgedge-postgres-mcp-server',
        'vectorizer': 'pgedge-vectorizer',
        'rag_server': 'pgedge-rag-server',
        'docloader': 'pgedge-docloader',
        'container': 'pgedge-container',
        'pgedge-containers': 'pgedge-container'
    };

    var path = window.location.pathname;

    // Strip .md extension if present and retry
    if (path.endsWith('.md')) {
        var stripped = path.slice(0, -3) + '/';
        tryRedirect(stripped);
        return;
    }

    // Check legacy prefix mappings first
    for (var legacy in legacyPrefixes) {
        var legacyPrefix = '/' + legacy + '/';
        var legacyExact = '/' + legacy;
        if (path.startsWith(legacyPrefix) || path === legacyExact) {
            var newDocset = legacyPrefixes[legacy];
            var legacySubpath = path.startsWith(legacyPrefix) ? path.substring(legacyPrefix.length) : '';
            var latestForLegacy = versionedDocsets[newDocset];

            if (latestForLegacy) {
                // Try versioned path first
                var versionedUrl = '/' + newDocset + '/' + latestForLegacy + '/' + legacySubpath;
                tryRedirect(versionedUrl);
            } else {
                // Non-versioned docset, redirect to new prefix directly
                tryRedirect('/' + newDocset + '/' + legacySubpath);
            }
            return;
        }
    }

    // Check each versioned docset
    for (var docset in versionedDocsets) {
        var prefix = '/' + docset + '/';
        if (path.startsWith(prefix)) {
            var latestVersion = versionedDocsets[docset];
            var subpath = path.substring(prefix.length);
            var firstSegment = subpath.split('/')[0];

            // If path is under an old or unknown version, redirect to the
            // equivalent path under the latest version
            if (firstSegment.match(/^v\d/) || firstSegment === 'development') {
                // Strip the old version segment and redirect to latest
                var afterVersion = subpath.substring(firstSegment.length + 1);
                if (afterVersion) {
                    var redirectUrl = '/' + docset + '/' + latestVersion + '/' + afterVersion;
                    tryRedirect(redirectUrl);
                    return;
                }
                // Just an old version root — redirect to latest root
                tryRedirect('/' + docset + '/' + latestVersion + '/');
                return;
            }

            // Unversioned subpath — redirect to latest version
            var redirectUrl = '/' + docset + '/' + latestVersion + '/' + subpath;
            tryRedirect(redirectUrl);
            return;
        }
    }

    // Not a versioned docset path - show 404
    show404();
})();
</script>
{% endblock %}
