# =============================================================================
# pgEdge RAG Server - Main Playbook
# =============================================================================
#
# This playbook configures the RAG server on existing hosts.
# To deploy EC2 instances first, run: ansible-playbook playbooks/deploy_ec2.yml
#
# Usage:
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --tags postgresql
#   ansible-playbook playbooks/site.yml --tags rag_server
#   ansible-playbook playbooks/site.yml --tags cloudflared
#   ansible-playbook playbooks/site.yml --tags docloader
#
# Note: The chat API proxy is handled by Cloudflare Pages Functions (functions/api/chat/)
# which deploy automatically with the documentation site. No separate worker deployment needed.
#
# Note: Vault password is read from .pgedge-docs-vault-pass (configured in ansible.cfg)
#
# =============================================================================

---
- name: Configure pgEdge RAG Server
  hosts: rag_servers
  become: true
  gather_facts: true
  vars_files:
    - ../inventory/group_vars/all/vault.yml

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: always

    - name: Install common packages
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
          - python3-psycopg2
        state: present
      tags: always

  roles:
    - role: postgresql
      tags: postgresql

    - role: rag_server
      tags: rag_server

    - role: cloudflared
      tags: cloudflared

    - role: docloader
      tags: docloader

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          RAG Server deployment complete!

          Services:
            - PostgreSQL: running on localhost:5432
            - RAG Server: running on {{ rag_server.listen_address }}:{{ rag_server.port }}
            - Cloudflared: connecting to {{ cloudflared.internal_hostname }}

          Documentation Loading:
            - Config: /etc/pgedge/docloader/config.yaml
            - Run: sudo load-docs

          Website Crawling:
            - Config: /etc/pgedge/docloader/websites.yaml
            - Run: sudo crawl-website
            - Then: sudo load-docs

          Next steps:
            1. Edit /etc/pgedge/docloader/config.yaml to customize sources
            2. Run 'sudo crawl-website' to crawl website content
            3. Run 'sudo load-docs' to load documentation into the database
            4. Test the chat interface on your documentation site
      tags: always
