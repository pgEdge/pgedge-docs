# =============================================================================
# pgEdge RAG Server - EC2 Deployment Playbook
# =============================================================================
#
# This playbook creates an EC2 instance for the RAG server.
#
# Prerequisites:
#   - AWS credentials configured (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
#   - boto3 installed: pip install boto3
#   - SSH key pair created in AWS
#
# Usage:
#   ansible-playbook playbooks/deploy_ec2.yml
#
# Override variables:
#   ansible-playbook playbooks/deploy_ec2.yml -e "ec2.region=us-west-2"
#   ansible-playbook playbooks/deploy_ec2.yml -e "ec2.instance_type=t3.large"
#
# =============================================================================

---
- name: Deploy EC2 Instance for RAG Server
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: ec2_deploy
      tags: ec2

  post_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ ec2_instance.public_ip_address }}"
        port: 22
        delay: 30
        timeout: 300
        state: started
      when: ec2_instance is defined

    - name: Display instance information
      ansible.builtin.debug:
        msg: |
          EC2 Instance Created Successfully!

          Instance ID: {{ ec2_instance.instance_id }}
          Public IP: {{ ec2_instance.public_ip_address }}
          Private IP: {{ ec2_instance.private_ip_address }}
          Region: {{ ec2.region }}
          Instance Type: {{ ec2.instance_type }}

          Add to inventory/hosts.yml:

          all:
            children:
              rag_servers:
                hosts:
                  rag1:
                    ansible_host: {{ ec2_instance.public_ip_address }}
                    ansible_user: admin
                    ansible_ssh_private_key_file: ~/.ssh/{{ ec2.key_name }}.pem

          Then run: ansible-playbook playbooks/site.yml
      when: ec2_instance is defined
