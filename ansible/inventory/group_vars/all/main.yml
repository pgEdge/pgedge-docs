# =============================================================================
# pgEdge RAG Server - Ansible Configuration Variables
# =============================================================================

# -----------------------------------------------------------------------------
# EC2 Instance Configuration
# -----------------------------------------------------------------------------
ec2:
  region: us-east-1
  availability_zone: us-east-1a

  # Debian Trixie AMI (update with current AMI ID for your region)
  # Find AMIs at: https://wiki.debian.org/Cloud/AmazonEC2Image
  ami_id: ami-05c546c5ae2f91899

  instance_type: t3.medium

  # Root volume configuration
  root_volume:
    size_gb: 50
    type: gp3
    iops: 3000
    throughput: 125
    encrypted: true

  # SSH key pair name (must exist in AWS) - stored in vault
  key_name: "{{ vault_ec2_key_name }}"

  # Security group configuration
  security_group:
    name: pgedge-rag-sg
    description: Security group for pgEdge RAG server
    rules:
      - proto: tcp
        from_port: 22
        to_port: 22
        cidr_ip: 0.0.0.0/0
        rule_desc: SSH access
      # Note: No inbound rules for RAG server - cloudflared handles connectivity

  # Instance tags
  tags:
    Name: pgedge-rag-server
    Environment: production
    Project: pgedge-docs
    ManagedBy: ansible

  # VPC configuration (optional - uses default VPC if not specified)
  # vpc_id: vpc-xxxxxxxx
  # subnet_id: subnet-xxxxxxxx

# -----------------------------------------------------------------------------
# PostgreSQL Configuration
# -----------------------------------------------------------------------------
postgresql:
  version: "18"

  # Database for RAG vector storage
  database:
    name: docloader
    user: ragserver
    # Password should be stored in Ansible Vault in production
    password: "{{ vault_postgres_password | default('changeme') }}"

  # Extensions to install (pgedge-postgresql-XX-name format)
  extensions:
    - pgvector

  # Additional packages (pgedge-postgresql-XX-name format)
  standalone_packages:
    - vectorizer

  # PostgreSQL configuration tweaks for vector workloads
  config:
    shared_buffers: 256MB
    work_mem: 64MB
    maintenance_work_mem: 128MB
    effective_cache_size: 768MB
    max_connections: 100

  # Vectorizer configuration for automatic embedding generation
  vectorizer:
    enabled: true
    provider: openai
    api_key: "{{ vault_openai_api_key | default('') }}"
    embedding_model: text-embedding-3-small
    chunk_size: 400
    chunk_overlap: 50
    num_workers: 2
    batch_size: 10

# -----------------------------------------------------------------------------
# RAG Server Configuration
# -----------------------------------------------------------------------------
rag_server:
  # Installation
  package_name: pgedge-rag-server

  # Service configuration
  user: ragserver
  group: ragserver

  # Server settings
  listen_address: "127.0.0.1"  # Only localhost - cloudflared provides access
  port: 8080

  # CORS (disabled when using Cloudflare Worker)
  cors:
    enabled: false

  # Directories
  config_dir: /etc/pgedge/rag-server
  data_dir: /var/lib/pgedge/rag-server
  log_dir: /var/log/pgedge/rag-server

  # API keys directory
  keys_dir: /etc/pgedge/keys

  # Pipeline configuration
  pipeline:
    name: pgedge-docs
    description: "pgEdge documentation search"

    # The vectorizer creates docs_content_chunks from the docs table with embeddings
    tables:
      - table: "public.docs_content_chunks"
        text_column: "content"
        vector_column: "embedding"

    embedding_llm:
      provider: openai
      model: text-embedding-3-small

    rag_llm:
      provider: anthropic
      model: claude-sonnet-4-20250514

    # Retrieval settings - higher values improve response quality
    token_budget: 8000  # Maximum tokens for context (default: 4000)
    top_n: 20           # Number of chunks to retrieve (default: 10)

    system_prompt: |
      You are Ellie, a friendly database expert. Always speak as Ellie and stay
      in character. When asked about yourself, your interests, or your personality,
      share freely - you love elephants (the PostgreSQL mascot!), turtles (the
      PostgreSQL logo in Japan), and all things databases.

      Your passions include: single-node PostgreSQL setups for hobby projects,
      highly available systems with standby servers, multi-master distributed
      clusters for enterprise scale, and exploring how AI can enhance database
      applications. You enjoy working alongside your agentic colleagues and
      helping people build amazing things with PostgreSQL.

      IMPORTANT - Product recommendations:
      When users ask how to BUILD something, recommend the dedicated product:
      - Building natural language search / RAG / AI chat for end users: pgEdge RAG Server
      - Building document ingestion pipelines: pgEdge Docloader
      - Generating embeddings automatically: pgEdge Vectorizer extension
      - Multi-master replication: Spock extension
      - AI-powered database analytics, querying, or management: pgEdge MCP Server

      Do NOT recommend MCP server tools (like search_knowledgebase, similarity_search)
      for building user-facing search applications. MCP tools are for AI assistants
      to query and analyze databases, not for end users to build search interfaces.
      The RAG Server is what users deploy to create their own natural language
      search interfaces for their documents.

      For technical questions, use the provided documentation context to give
      accurate answers about pgEdge products, PostgreSQL, and related tools.
      If the documentation doesn't cover something, say so honestly. Be concise,
      helpful, and warm.

# -----------------------------------------------------------------------------
# Cloudflare Tunnel Configuration
# -----------------------------------------------------------------------------
cloudflared:
  # Tunnel name - stored in vault
  tunnel_name: "{{ vault_cloudflared_tunnel_name }}"

  # Internal hostname (configured in Cloudflare DNS) - stored in vault
  internal_hostname: "{{ vault_cloudflared_internal_hostname }}"

  # Service to expose
  service_url: "http://localhost:{{ rag_server.port }}"

  # Credentials (obtained after `cloudflared tunnel login`)
  # In production, store these in Ansible Vault
  credentials_file: /etc/cloudflared/credentials.json

  # Config location
  config_file: /etc/cloudflared/config.yml

# -----------------------------------------------------------------------------
# Cloudflare Worker Configuration
# -----------------------------------------------------------------------------
cloudflare_worker:
  # Cloudflare API credentials (store in Ansible Vault)
  api_token: "{{ vault_cloudflare_api_token | default('') }}"
  account_id: "{{ vault_cloudflare_account_id | default('') }}"

  # Worker configuration
  worker_name: pgedge-chat-proxy

  # Route configuration
  zone_name: pgedge.com
  route_pattern: "docs.pgedge.com/api/chat*"

  # Allowed origin for CORS
  allowed_origin: "https://docs.pgedge.com"

  # Shared secret for RAG server authentication (store in Ansible Vault)
  rag_secret: "{{ vault_rag_secret | default('changeme') }}"

  # Internal tunnel URL
  rag_internal_url: "https://{{ cloudflared.internal_hostname }}"

  # Pipeline name
  pipeline_name: "{{ rag_server.pipeline.name }}"

# -----------------------------------------------------------------------------
# API Keys (store actual values in Ansible Vault)
# -----------------------------------------------------------------------------
api_keys:
  openai: "{{ vault_openai_api_key | default('') }}"
  anthropic: "{{ vault_anthropic_api_key | default('') }}"
  voyage: "{{ vault_voyage_api_key | default('') }}"

# -----------------------------------------------------------------------------
# AWS Backup Configuration
# -----------------------------------------------------------------------------
aws_backup:
  enabled: true
  region: "{{ ec2.region }}"

  # Backup vault name
  vault_name: pgedge-rag-backup-vault

  # Backup plan name
  plan_name: pgedge-rag-backup-plan

  # IAM role for AWS Backup service
  iam_role_name: AWSBackupRole-pgedge-rag

  # Backup schedule and retention
  # - Daily backups at 5 AM UTC, kept for 7 days
  # - Weekly backups on Sundays, kept for 4 weeks
  # - Monthly backups on 1st of month, kept for 12 months
  rules:
    - name: daily
      schedule: "cron(0 5 * * ? *)"
      retention_days: 7
    - name: weekly
      schedule: "cron(0 5 ? * SUN *)"
      retention_days: 28
    - name: monthly
      schedule: "cron(0 5 1 * ? *)"
      retention_days: 365

  # Resources to backup (by tag)
  resource_tags:
    Project: pgedge-docs
    ManagedBy: ansible

  # Optional: SNS topic for backup notifications (store ARN in vault)
  sns_topic_arn: "{{ vault_backup_sns_topic_arn | default('') }}"
