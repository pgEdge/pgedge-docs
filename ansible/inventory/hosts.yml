# Ansible Inventory for pgEdge RAG Server
#
# Connection settings for rag_servers are in group_vars/rag_servers.yml
# The server IP address is stored securely in group_vars/vault.yml
#
# To add a new RAG server:
#   1. Add the host IP to vault.yml (vault_rag_server_ip)
#   2. Add the hostname below under rag_servers
#
all:
  children:
    rag_servers:
      hosts:
        rag1:

    localhost:
      hosts:
        local:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
