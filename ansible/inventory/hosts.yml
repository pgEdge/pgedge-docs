# Ansible Inventory for pgEdge RAG Server
#
# After running the EC2 deployment playbook, add your instance here:
#
# all:
#   children:
#     rag_servers:
#       hosts:
#         rag1:
#           ansible_host: <ec2-public-ip>
#           ansible_user: admin
#           ansible_ssh_private_key_file: ~/.ssh/your-key.pem

all:
  children:
    rag_servers:
      hosts:
        # Add your RAG server hosts here after EC2 deployment
        # Example:
        # rag1:
        #   ansible_host: 54.123.45.67
        #   ansible_user: admin
        #   ansible_ssh_private_key_file: ~/.ssh/pgedge-rag.pem

    localhost:
      hosts:
        local:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
