# GitHub OIDC Role - Default Variables
---
# GitHub repository allowed to assume the role (org/repo format)
github_oidc_repo: pgEdge/pgedge-docs

# GitHub branch allowed to assume the role
github_oidc_branch: main

# IAM role name for GitHub Actions
github_oidc_role_name: pgedge-github-actions-rag-update

# AWS region
github_oidc_region: "{{ ec2.region | default('us-east-1') }}"

# OIDC provider thumbprint for GitHub Actions
# This is GitHub's OIDC thumbprint — it rarely changes
github_oidc_thumbprint: 6938fd4d98bab03faadb97b34396831e3780aea1

# SSM permissions — which instance the role can target
github_oidc_ssm_instance_id: "{{ vault_rag_instance_id | default('') }}"
