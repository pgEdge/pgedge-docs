# Docloader Role - Default Variables
---
# Installation method: 'github' or 'apt'
# github: Downloads from GitHub Releases (for pre-release/beta builds)
# apt: Installs from pgEdge apt repository
docloader_install_method: github

# GitHub Release settings
docloader_version: v1.0.0-beta1
docloader_github_release_url: "https://github.com/pgEdge/pgedge-docloader/releases/download/{{ docloader_version }}/pgedge-docloader_{{ docloader_version | regex_replace('^v', '') }}_Linux_x86_64.tar.gz"

# Apt package name (used when docloader_install_method == 'apt')
docloader_package: pgedge-docloader

# Installation paths
docloader_config_dir: /etc/pgedge/docloader
docloader_data_dir: /var/lib/pgedge/docloader

# User/group (reuse ragserver user)
docloader_user: ragserver
docloader_group: ragserver

# Database connection (from postgresql role)
docloader_db_host: localhost
docloader_db_port: 5432
docloader_db_name: "{{ postgresql.database.name }}"
docloader_db_user: "{{ postgresql.database.user }}"
docloader_db_password: "{{ postgresql.database.password }}"
docloader_db_table: docs
docloader_db_sslmode: prefer

# Column mappings to match the docs table schema
docloader_col_title: title
docloader_col_content: content
docloader_col_filename: source_path

# Wiki extraction settings (for extract-wiki command)
docloader_wiki_url: "https://pgedge.atlassian.net"
docloader_wiki_space: "KB"
docloader_wiki_parent_page: "61571365"
# Atlassian credentials - store in vault as:
#   docloader_atlassian_email: your.email@pgedge.com
#   docloader_atlassian_token: your-api-token
