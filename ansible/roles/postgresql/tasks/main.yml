# PostgreSQL Role - Main Tasks
---
- name: Download pgEdge release package
  ansible.builtin.get_url:
    url: https://apt.pgedge.com/repodeb/pgedge-release_latest_all.deb
    dest: /tmp/pgedge-release.deb
    mode: '0644'

- name: Install pgEdge release package
  ansible.builtin.apt:
    deb: /tmp/pgedge-release.deb
    state: present

- name: Remove temporary release package
  ansible.builtin.file:
    path: /tmp/pgedge-release.deb
    state: absent

- name: Update apt cache after adding pgEdge repo
  ansible.builtin.apt:
    update_cache: true

- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - "pgedge-postgresql-{{ pg_version }}"
      - "pgedge-postgresql-client-{{ pg_version }}"
      - "pgedge-postgresql-{{ pg_version }}-pgvector"
    state: present

- name: Install PostgreSQL extensions (pgedge-postgresql-XX-name format)
  ansible.builtin.apt:
    name: "pgedge-postgresql-{{ pg_version }}-{{ item }}"
    state: present
  loop: "{{ pg_extensions }}"
  when:
    - item != 'pgvector'
    - item not in pg_standalone_packages

- name: Install standalone packages (pgedge-postgresql-XX-vectorizer, etc.)
  ansible.builtin.apt:
    name: "pgedge-postgresql-{{ pg_version }}-{{ item }}"
    state: present
  loop: "{{ pg_standalone_packages }}"
  when: pg_standalone_packages | length > 0

- name: Check for existing PostgreSQL clusters
  ansible.builtin.command: pg_lsclusters --no-header
  register: pg_clusters
  changed_when: false
  failed_when: false

- name: Remove clusters with missing binaries
  ansible.builtin.command: "pg_dropcluster {{ item.split()[0] }} {{ item.split()[1] }} --stop"
  loop: "{{ pg_clusters.stdout_lines }}"
  when:
    - pg_clusters.stdout_lines | length > 0
    - "'binaries_missing' in item"
  failed_when: false

- name: Check if target cluster exists
  ansible.builtin.command: pg_lsclusters --no-header
  register: pg_clusters_check
  changed_when: false

- name: Create PostgreSQL cluster if not exists
  ansible.builtin.command: "pg_createcluster {{ pg_version }} main"
  when: pg_clusters_check.stdout_lines | select('match', '^' + pg_version + '\\s+main') | list | length == 0

# Configure vectorizer BEFORE starting PostgreSQL
- name: Create vectorizer API key directory
  ansible.builtin.file:
    path: "{{ vectorizer_api_key_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when: vectorizer_enabled | default(false)

- name: Deploy vectorizer API key file
  ansible.builtin.copy:
    content: "{{ vectorizer_api_key }}"
    dest: "{{ vectorizer_api_key_dir }}/{{ vectorizer_provider }}.key"
    owner: postgres
    group: postgres
    mode: '0600'
  when:
    - vectorizer_enabled | default(false)
    - vectorizer_api_key | length > 0
  no_log: true

- name: Configure shared_preload_libraries for vectorizer
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: "^#?shared_preload_libraries\\s*="
    line: "shared_preload_libraries = 'pgedge_vectorizer'"
    state: present
  when: vectorizer_enabled | default(false)
  notify: Restart PostgreSQL

- name: Configure vectorizer settings
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: "^#?{{ item.key }}\\s*="
    line: "{{ item.key }} = '{{ item.value }}'"
    state: present
  loop:
    - { key: 'pgedge_vectorizer.databases', value: '{{ pg_database }}' }
    - { key: 'pgedge_vectorizer.provider', value: '{{ vectorizer_provider }}' }
    - { key: 'pgedge_vectorizer.api_key_file', value: '{{ vectorizer_api_key_dir }}/{{ vectorizer_provider }}.key' }
    - { key: 'pgedge_vectorizer.model', value: '{{ vectorizer_embedding_model }}' }
    - { key: 'pgedge_vectorizer.num_workers', value: '{{ vectorizer_num_workers }}' }
    - { key: 'pgedge_vectorizer.batch_size', value: '{{ vectorizer_batch_size }}' }
    - { key: 'pgedge_vectorizer.default_chunk_size', value: '{{ vectorizer_chunk_size }}' }
    - { key: 'pgedge_vectorizer.default_chunk_overlap', value: '{{ vectorizer_chunk_overlap }}' }
  when: vectorizer_enabled | default(false)
  notify: Restart PostgreSQL

- name: Configure PostgreSQL settings
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: "^#?{{ item.key }}\\s*="
    line: "{{ item.key }} = '{{ item.value }}'"
    state: present
  loop: "{{ pg_config | dict2items }}"
  notify: Restart PostgreSQL
  when: pg_config | length > 0

# Flush handlers to apply configuration and restart PostgreSQL
- name: Flush handlers to apply PostgreSQL configuration
  ansible.builtin.meta: flush_handlers

- name: Ensure PostgreSQL is started and enabled
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Wait for PostgreSQL to be ready
  ansible.builtin.wait_for:
    port: 5432
    host: 127.0.0.1
    delay: 2
    timeout: 30

- name: Create RAG database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ pg_user }}"
    password: "{{ pg_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    state: present
  no_log: true

- name: Create RAG database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ pg_database }}"
    owner: "{{ pg_user }}"
    encoding: UTF8
    lc_collate: "{{ pg_lc_collate }}"
    lc_ctype: "{{ pg_lc_ctype }}"
    template: template0
    state: present

- name: Enable pgvector extension
  become: true
  become_user: postgres
  community.postgresql.postgresql_ext:
    name: vector
    db: "{{ pg_database }}"
    state: present

- name: Check if pgedge_vectorizer extension exists
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ pg_database }}"
    query: "SELECT COUNT(*) as count FROM pg_extension WHERE extname = 'pgedge_vectorizer'"
  register: vectorizer_ext_check
  when: vectorizer_enabled | default(false)

- name: Enable pgedge_vectorizer extension
  become: true
  become_user: postgres
  community.postgresql.postgresql_ext:
    name: pgedge_vectorizer
    db: "{{ pg_database }}"
    state: present
  when:
    - vectorizer_enabled | default(false)
    - vectorizer_ext_check.query_result[0].count | int == 0

- name: Grant privileges to RAG user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ pg_database }}"
    roles: "{{ pg_user }}"
    type: database
    privs: ALL
    state: present

- name: Configure pg_hba.conf for local connections
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    line: "host    {{ pg_database }}    {{ pg_user }}    127.0.0.1/32    scram-sha-256"
    insertafter: "^# IPv4 local connections"
    state: present
  notify: Reload PostgreSQL

- name: Flush handlers to ensure PostgreSQL is reloaded
  ansible.builtin.meta: flush_handlers

- name: Deploy database schema script
  ansible.builtin.template:
    src: schema.sql.j2
    dest: /tmp/pgedge_schema.sql
    mode: '0644'

- name: Apply database schema
  become: true
  become_user: postgres
  community.postgresql.postgresql_script:
    db: "{{ pg_database }}"
    path: /tmp/pgedge_schema.sql
  register: schema_result
  changed_when: false
  failed_when: schema_result.failed | default(false)

- name: Check if vectorization is already enabled
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ pg_database }}"
    query: "SELECT COUNT(*) as count FROM information_schema.tables WHERE table_name = 'docs_content_chunks'"
  register: vectorization_check
  when: vectorizer_enabled | default(false)

- name: Deploy vectorizer configuration script
  ansible.builtin.template:
    src: vectorizer.sql.j2
    dest: /tmp/pgedge_vectorizer.sql
    mode: '0644'
  when:
    - vectorizer_enabled | default(false)
    - vectorization_check.query_result[0].count | int == 0

- name: Apply vectorizer configuration
  become: true
  become_user: postgres
  community.postgresql.postgresql_script:
    db: "{{ pg_database }}"
    path: /tmp/pgedge_vectorizer.sql
  when:
    - vectorizer_enabled | default(false)
    - vectorization_check.query_result[0].count | int == 0
  register: vectorizer_result
  failed_when: false

- name: Clean up temporary SQL files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/pgedge_schema.sql
    - /tmp/pgedge_vectorizer.sql
