# PostgreSQL Role - Default Variables

pg_version: "{{ postgresql.version | default('17') }}"

pg_repo_url: "{{ postgresql.repo.url }}"
pg_repo_key_url: "{{ postgresql.repo.key_url }}"
pg_repo_distribution: "{{ postgresql.repo.distribution | default('trixie') }}"
pg_repo_components: "{{ postgresql.repo.components | default('main') }}"

pg_database: "{{ postgresql.database.name }}"
pg_user: "{{ postgresql.database.user }}"
pg_password: "{{ postgresql.database.password }}"

pg_extensions: "{{ postgresql.extensions | default(['pgvector']) }}"

# Standalone packages that don't follow postgresql-XX-name pattern
pg_standalone_packages: "{{ postgresql.standalone_packages | default(['pgedge-vectorizer']) }}"

pg_config: "{{ postgresql.config | default({}) }}"

# Vectorizer configuration
vectorizer_embedding_model: "{{ postgresql.vectorizer.embedding_model | default('text-embedding-3-small') }}"
vectorizer_embedding_dimensions: "{{ postgresql.vectorizer.embedding_dimensions | default(1536) }}"
vectorizer_chunk_size: "{{ postgresql.vectorizer.chunk_size | default(1000) }}"
vectorizer_chunk_overlap: "{{ postgresql.vectorizer.chunk_overlap | default(200) }}"
vectorizer_template: "{{ postgresql.vectorizer.template | default('Product: $product, Version: $version\\n\\n$content') }}"
vectorizer_schedule_interval: "{{ postgresql.vectorizer.schedule_interval | default('1 minute') }}"
