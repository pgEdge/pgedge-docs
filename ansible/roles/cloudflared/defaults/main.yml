# Cloudflared Role - Default Variables

cf_tunnel_name: "{{ cloudflared.tunnel_name | default('pgedge-rag') }}"
cf_internal_hostname: "{{ cloudflared.internal_hostname }}"
cf_service_url: "{{ cloudflared.service_url | default('http://localhost:8080') }}"
cf_credentials_file: "{{ cloudflared.credentials_file | default('/etc/cloudflared/credentials.json') }}"
cf_config_file: "{{ cloudflared.config_file | default('/etc/cloudflared/config.yml') }}"

# cloudflared download URL
cf_download_url: "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
