# RAG Server Role - Main Tasks
---
- name: Create RAG server group
  ansible.builtin.group:
    name: "{{ rag_group }}"
    system: true
    state: present

- name: Create RAG server user
  ansible.builtin.user:
    name: "{{ rag_user }}"
    group: "{{ rag_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ rag_data_dir }}"
    create_home: false
    state: present

- name: Create RAG server directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rag_user }}"
    group: "{{ rag_group }}"
    mode: '0750'
  loop:
    - "{{ rag_config_dir }}"
    - "{{ rag_data_dir }}"
    - "{{ rag_log_dir }}"
    - "{{ rag_keys_dir }}"

# Install from GitHub Release (for pre-release/beta builds)
- name: Download RAG server from GitHub Release
  ansible.builtin.get_url:
    url: "{{ rag_github_release_url }}"
    dest: /usr/local/bin/pgedge-rag-server
    mode: '0755'
    force: "{{ rag_force_download | default(false) }}"
  when: rag_install_method == 'github'
  notify: Restart RAG Server

# Alternative: Install from apt package
- name: Install RAG server package from apt
  ansible.builtin.apt:
    name: "{{ rag_package_name }}"
    state: present
  when: rag_install_method == 'apt'
  notify: Restart RAG Server

- name: Deploy API keys
  ansible.builtin.copy:
    content: "{{ item.key_value }}"
    dest: "{{ rag_keys_dir }}/{{ item.key_name }}.key"
    owner: "{{ rag_user }}"
    group: "{{ rag_group }}"
    mode: '0600'
  loop:
    - { key_name: openai, key_value: "{{ api_keys.openai }}" }
    - { key_name: anthropic, key_value: "{{ api_keys.anthropic }}" }
    - { key_name: voyage, key_value: "{{ api_keys.voyage }}" }
  when: item.key_value | length > 0
  no_log: true
  notify: Restart RAG Server

- name: Deploy RAG server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rag_config_dir }}/config.yaml"
    owner: "{{ rag_user }}"
    group: "{{ rag_group }}"
    mode: '0640'
  notify: Restart RAG Server

- name: Deploy systemd service file
  ansible.builtin.template:
    src: pgedge-rag-server.service.j2
    dest: /etc/systemd/system/pgedge-rag-server.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart RAG Server

- name: Enable and start RAG server
  ansible.builtin.systemd:
    name: pgedge-rag-server
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for RAG server to be ready
  ansible.builtin.uri:
    url: "http://{{ rag_listen_address }}:{{ rag_port }}/v1/health"
    method: GET
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 30
  delay: 2
