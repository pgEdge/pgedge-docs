# EC2 Deployment Role - Default Variables
# These can be overridden in group_vars/all.yml or on the command line

ec2_region: "{{ ec2.region | default('us-east-1') }}"
ec2_az: "{{ ec2.availability_zone | default('us-east-1a') }}"
ec2_ami_id: "{{ ec2.ami_id }}"
ec2_instance_type: "{{ ec2.instance_type | default('t3.medium') }}"
ec2_key_name: "{{ ec2.key_name }}"

ec2_root_volume_size: "{{ ec2.root_volume.size_gb | default(50) }}"
ec2_root_volume_type: "{{ ec2.root_volume.type | default('gp3') }}"
ec2_root_volume_iops: "{{ ec2.root_volume.iops | default(3000) }}"
ec2_root_volume_throughput: "{{ ec2.root_volume.throughput | default(125) }}"
ec2_root_volume_encrypted: "{{ ec2.root_volume.encrypted | default(true) }}"

ec2_security_group_name: "{{ ec2.security_group.name | default('pgedge-rag-sg') }}"
ec2_security_group_description: "{{ ec2.security_group.description | default('Security group for pgEdge RAG server') }}"

ec2_tags: "{{ ec2.tags | default({}) }}"

ec2_vpc_id: "{{ ec2.vpc_id | default(omit) }}"
ec2_subnet_id: "{{ ec2.subnet_id | default(omit) }}"
