# Cloudflare Worker Role - Default Variables

cf_api_token: "{{ cloudflare_worker.api_token }}"
cf_account_id: "{{ cloudflare_worker.account_id }}"
cf_worker_name: "{{ cloudflare_worker.worker_name | default('pgedge-chat-proxy') }}"
cf_zone_name: "{{ cloudflare_worker.zone_name }}"
cf_route_pattern: "{{ cloudflare_worker.route_pattern }}"
cf_allowed_origin: "{{ cloudflare_worker.allowed_origin }}"
cf_rag_secret: "{{ cloudflare_worker.rag_secret }}"
cf_rag_internal_url: "{{ cloudflare_worker.rag_internal_url }}"
cf_pipeline_name: "{{ cloudflare_worker.pipeline_name }}"
