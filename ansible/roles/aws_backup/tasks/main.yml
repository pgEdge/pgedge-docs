---
# =============================================================================
# AWS Backup Role - Main Tasks
# =============================================================================
# Creates AWS Backup vault, plan, and resource selection for automated backups
# Uses AWS CLI as the community.aws collection lacks backup modules

- name: Skip AWS Backup setup if disabled
  ansible.builtin.meta: end_play
  when: not (aws_backup.enabled | default(aws_backup_enabled | default(true)))

# Set computed variables
- name: Set AWS Backup variables
  ansible.builtin.set_fact:
    _backup_region: "{{ aws_backup.region | default(aws_backup_region) }}"
    _backup_vault_name: "{{ aws_backup.vault_name | default(aws_backup_vault_name) }}"
    _backup_plan_name: "{{ aws_backup.plan_name | default(aws_backup_plan_name) }}"
    _backup_iam_role_name: "{{ aws_backup.iam_role_name | default(aws_backup_iam_role_name) }}"
    _backup_resource_tags: "{{ aws_backup.resource_tags | default(aws_backup_resource_tags) }}"
    _backup_sns_topic_arn: "{{ aws_backup.sns_topic_arn | default(aws_backup_sns_topic_arn | default('')) }}"

# -----------------------------------------------------------------------------
# Get AWS Account ID
# -----------------------------------------------------------------------------
- name: Get AWS account ID
  ansible.builtin.command: aws sts get-caller-identity --query Account --output text
  register: aws_account_id
  changed_when: false

- name: Set account ID fact
  ansible.builtin.set_fact:
    _aws_account_id: "{{ aws_account_id.stdout }}"

# -----------------------------------------------------------------------------
# IAM Role for AWS Backup
# -----------------------------------------------------------------------------
- name: Check if IAM role exists
  ansible.builtin.command: >
    aws iam get-role
    --role-name {{ _backup_iam_role_name }}
  register: iam_role_check
  failed_when: false
  changed_when: false

- name: Create IAM role for AWS Backup
  when: iam_role_check.rc != 0
  block:
    - name: Create IAM role
      ansible.builtin.command: >
        aws iam create-role
        --role-name {{ _backup_iam_role_name }}
        --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"backup.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
        --description "IAM role for AWS Backup service - managed by Ansible"
        --tags Key=Project,Value=pgedge-docs Key=ManagedBy,Value=ansible
      register: create_role_result

    - name: Attach backup policy
      ansible.builtin.command: >
        aws iam attach-role-policy
        --role-name {{ _backup_iam_role_name }}
        --policy-arn arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup

    - name: Attach restore policy
      ansible.builtin.command: >
        aws iam attach-role-policy
        --role-name {{ _backup_iam_role_name }}
        --policy-arn arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

    - name: Wait for IAM role propagation
      ansible.builtin.pause:
        seconds: 10

# -----------------------------------------------------------------------------
# Backup Vault
# -----------------------------------------------------------------------------
- name: Check if backup vault exists
  ansible.builtin.command: >
    aws backup describe-backup-vault
    --backup-vault-name {{ _backup_vault_name }}
    --region {{ _backup_region }}
  register: vault_check
  failed_when: false
  changed_when: false

- name: Create backup vault
  when: vault_check.rc != 0
  ansible.builtin.command: >
    aws backup create-backup-vault
    --backup-vault-name {{ _backup_vault_name }}
    --backup-vault-tags Project=pgedge-docs,ManagedBy=ansible
    --region {{ _backup_region }}

# -----------------------------------------------------------------------------
# Backup Plan
# -----------------------------------------------------------------------------
- name: Check if backup plan exists
  ansible.builtin.command: >
    aws backup list-backup-plans
    --region {{ _backup_region }}
    --query "BackupPlansList[?BackupPlanName=='{{ _backup_plan_name }}'].BackupPlanId"
    --output text
  register: plan_check
  changed_when: false

- name: Create backup plan
  when: plan_check.stdout == ""
  block:
    - name: Create backup plan JSON
      ansible.builtin.set_fact:
        _backup_plan_json:
          BackupPlan:
            BackupPlanName: "{{ _backup_plan_name }}"
            Rules:
              - RuleName: daily
                TargetBackupVaultName: "{{ _backup_vault_name }}"
                ScheduleExpression: "cron(0 5 * * ? *)"
                StartWindowMinutes: 60
                CompletionWindowMinutes: 180
                Lifecycle:
                  DeleteAfterDays: 7
              - RuleName: weekly
                TargetBackupVaultName: "{{ _backup_vault_name }}"
                ScheduleExpression: "cron(0 5 ? * SUN *)"
                StartWindowMinutes: 60
                CompletionWindowMinutes: 180
                Lifecycle:
                  DeleteAfterDays: 28
              - RuleName: monthly
                TargetBackupVaultName: "{{ _backup_vault_name }}"
                ScheduleExpression: "cron(0 5 1 * ? *)"
                StartWindowMinutes: 60
                CompletionWindowMinutes: 180
                Lifecycle:
                  DeleteAfterDays: 365

    - name: Write backup plan to temp file
      ansible.builtin.copy:
        content: "{{ _backup_plan_json | to_json }}"
        dest: /tmp/backup-plan.json
        mode: '0600'

    - name: Create backup plan
      ansible.builtin.command: >
        aws backup create-backup-plan
        --cli-input-json file:///tmp/backup-plan.json
        --backup-plan-tags Project=pgedge-docs,ManagedBy=ansible
        --region {{ _backup_region }}
        --query BackupPlanId
        --output text
      register: create_plan_result

    - name: Remove temp file
      ansible.builtin.file:
        path: /tmp/backup-plan.json
        state: absent

    - name: Set backup plan ID
      ansible.builtin.set_fact:
        _backup_plan_id: "{{ create_plan_result.stdout | trim }}"

- name: Get existing backup plan ID
  when: plan_check.stdout != ""
  ansible.builtin.set_fact:
    _backup_plan_id: "{{ plan_check.stdout | trim }}"

# -----------------------------------------------------------------------------
# Resource Selection
# -----------------------------------------------------------------------------
- name: Check if backup selection exists
  ansible.builtin.command: >
    aws backup list-backup-selections
    --backup-plan-id {{ _backup_plan_id }}
    --region {{ _backup_region }}
    --query "BackupSelectionsList[?SelectionName=='pgedge-rag-resources'].SelectionId"
    --output text
  register: selection_check
  changed_when: false

- name: Create backup selection
  when: selection_check.stdout == ""
  block:
    - name: Create selection JSON
      ansible.builtin.set_fact:
        _backup_selection_json:
          BackupSelection:
            SelectionName: pgedge-rag-resources
            IamRoleArn: "arn:aws:iam::{{ _aws_account_id }}:role/{{ _backup_iam_role_name }}"
            ListOfTags:
              - ConditionType: STRINGEQUALS
                ConditionKey: Project
                ConditionValue: "{{ _backup_resource_tags.Project | default('pgedge-docs') }}"
              - ConditionType: STRINGEQUALS
                ConditionKey: ManagedBy
                ConditionValue: "{{ _backup_resource_tags.ManagedBy | default('ansible') }}"

    - name: Write selection to temp file
      ansible.builtin.copy:
        content: "{{ _backup_selection_json | to_json }}"
        dest: /tmp/backup-selection.json
        mode: '0600'

    - name: Create backup selection
      ansible.builtin.command: >
        aws backup create-backup-selection
        --backup-plan-id {{ _backup_plan_id }}
        --cli-input-json file:///tmp/backup-selection.json
        --region {{ _backup_region }}

    - name: Remove temp file
      ansible.builtin.file:
        path: /tmp/backup-selection.json
        state: absent

# -----------------------------------------------------------------------------
# Optional: SNS Notifications
# -----------------------------------------------------------------------------
- name: Configure backup vault notifications
  when: _backup_sns_topic_arn | length > 0
  ansible.builtin.command: >
    aws backup put-backup-vault-notifications
    --backup-vault-name {{ _backup_vault_name }}
    --sns-topic-arn {{ _backup_sns_topic_arn }}
    --backup-vault-events BACKUP_JOB_STARTED BACKUP_JOB_COMPLETED BACKUP_JOB_FAILED RESTORE_JOB_STARTED RESTORE_JOB_COMPLETED RESTORE_JOB_FAILED
    --region {{ _backup_region }}

# -----------------------------------------------------------------------------
# Display Summary
# -----------------------------------------------------------------------------
- name: Display AWS Backup configuration summary
  ansible.builtin.debug:
    msg:
      - "AWS Backup Configuration Complete!"
      - ""
      - "Vault: {{ _backup_vault_name }}"
      - "Plan: {{ _backup_plan_name }} ({{ _backup_plan_id }})"
      - "IAM Role: {{ _backup_iam_role_name }}"
      - ""
      - "Backup Schedule:"
      - "  - Daily at 5 AM UTC: Retained for 7 days"
      - "  - Weekly (Sundays) at 5 AM UTC: Retained for 28 days"
      - "  - Monthly (1st) at 5 AM UTC: Retained for 365 days"
      - ""
      - "Resources selected by tags:"
      - "  - Project: {{ _backup_resource_tags.Project | default('pgedge-docs') }}"
      - "  - ManagedBy: {{ _backup_resource_tags.ManagedBy | default('ansible') }}"
