# =============================================================================
# AWS Backup Role - Default Variables
# =============================================================================

# Whether AWS Backup is enabled
aws_backup_enabled: true

# AWS Region (inherited from ec2.region by default)
aws_backup_region: "{{ ec2.region | default('us-east-1') }}"

# Backup vault configuration
aws_backup_vault_name: "pgedge-rag-backup-vault"

# Backup plan configuration
aws_backup_plan_name: "pgedge-rag-backup-plan"

# -----------------------------------------------------------------------------
# Backup Schedule & Retention
# -----------------------------------------------------------------------------
# Uses sensible defaults: daily, weekly, and monthly backups with tiered retention

aws_backup_rules:
  # Daily backups - kept for 7 days
  - name: daily
    schedule: "cron(0 5 * * ? *)"  # 5:00 AM UTC daily
    start_window_minutes: 60
    completion_window_minutes: 180
    lifecycle:
      delete_after_days: 7
    copy_actions: []

  # Weekly backups (Sundays) - kept for 4 weeks
  - name: weekly
    schedule: "cron(0 5 ? * SUN *)"  # 5:00 AM UTC every Sunday
    start_window_minutes: 60
    completion_window_minutes: 180
    lifecycle:
      delete_after_days: 28
    copy_actions: []

  # Monthly backups (1st of month) - kept for 12 months
  - name: monthly
    schedule: "cron(0 5 1 * ? *)"  # 5:00 AM UTC on 1st of each month
    start_window_minutes: 60
    completion_window_minutes: 180
    lifecycle:
      delete_after_days: 365
    copy_actions: []

# -----------------------------------------------------------------------------
# Resource Selection
# -----------------------------------------------------------------------------
# By default, backs up EC2 instances tagged with Project: pgedge-docs

aws_backup_selection_name: "pgedge-rag-resources"

aws_backup_resource_tags:
  Project: pgedge-docs
  ManagedBy: ansible

# -----------------------------------------------------------------------------
# IAM Role Configuration
# -----------------------------------------------------------------------------
aws_backup_iam_role_name: "AWSBackupRole-pgedge-rag"

# -----------------------------------------------------------------------------
# Optional: SNS Notifications
# -----------------------------------------------------------------------------
# Set to an SNS topic ARN to receive backup notifications
aws_backup_sns_topic_arn: ""

# -----------------------------------------------------------------------------
# Optional: Cross-region backup copy
# -----------------------------------------------------------------------------
# Set to enable copying backups to another region for disaster recovery
aws_backup_copy_to_region: ""
aws_backup_copy_vault_name: ""
